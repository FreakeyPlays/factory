<main class="mx-auto flex max-w-2xl flex-col gap-6 p-8">
  <h1 class="text-2xl font-semibold">Ask an agent</h1>
  <p>
    Send a single prompt to an installed, signed-in CLI. Each request starts a new conversation.
  </p>

  <form class="flex flex-col gap-4" (submit)="send($event)">
    <label class="flex flex-col gap-2">
      Agent
      <lib-select [(value)]="agent" [options]="choices" [disabled]="pending()" />
    </label>
    <label class="flex flex-col gap-2">
      Prompt
      <lib-textarea
        [(value)]="prompt"
        [rows]="4"
        [required]="true"
        placeholder="Explain what a Rust module is in two sentences."
        [disabled]="pending()"
      />
    </label>
    <p class="text-sm" [class.text-red-700]="overBudget()">{{ budget() }}</p>
    <lib-button
      type="submit"
      [disabled]="pending() || overBudget()"
      [label]="pending() ? 'Waiting for agent…' : 'Send'"
    />
  </form>

  @if (error()) {
    <p role="alert" class="whitespace-pre-wrap">{{ error() }}</p>
  }
  <section aria-live="polite" [attr.aria-busy]="pending()">
    @if (answer()) {
      <h2 class="mb-2 font-semibold">Answer</h2>
      <pre class="whitespace-pre-wrap wrap-break-word">{{ answer() }}</pre>
    }
  </section>
</main>
